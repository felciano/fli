[project]
name = "flights"
version = "0.10.0"
description = "A Python wrapper for Google Flights API"
authors = [
    { name = "Punit Arani", email = "punitsai36@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["flights", "google-flights", "travel", "api", "flight-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "babel>=2.17.0",
    "click>=8.0.0",
    "curl-cffi>=0.15.0",
    "httpx>=0.28.1",
    "plotext>=5.3.2",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "ratelimit>=2.2.1",
    "rich>=13.8.0",
    "tenacity>=9.0.0",
    "typer>=0.15.1",
]

[project.optional-dependencies]
mcp = [
    "fastapi>=0.115.6",
    "fastmcp>=3.2",
    "mcp>=1.15.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.34.0",
]
browser = [
    # Playwright only. A fresh, signed-out Chrome for Testing profile clears
    # Google's attestation unaided, so a stealth/fingerprint-spoofing helper
    # would buy nothing and raise the arms-race stakes ADR 001 already counts
    # as a cost. The floor is about uv.lock reproducibility, not features:
    # connect_over_cdp, expect_response and launch_persistent_context are all
    # long-stable.
    "playwright>=1.48",
]
all = [
    "flights[mcp]",
    # `all` means all. The install that must stay honest is the default one,
    # `uv add flights`, and it still ships no browser. Note that the wheel is
    # not the browser: `playwright install chromium` remains a separate step
    # even under this extra.
    "flights[browser]",
]
dev = [
    "mkdocs-material[imaging]>=9.5.49",
    "mkdocstrings[python]>=0.27.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    # Needed only so tests/test_dependency_declarations.py can parse this file
    # on Python 3.10, where tomllib is not yet in the stdlib.
    "tomli>=2.0.0; python_version < '3.11'",
    "twine>=6.0.0",
]

[project.scripts]
fli = "fli.cli:cli"
fli-mcp = "fli.mcp._entry:run"
fli-mcp-http = "fli.mcp._entry:run_http"

[project.urls]
Homepage = "https://github.com/punitarani/fli"
Repository = "https://github.com/punitarani/fli"
Documentation = "https://punitarani.github.io/fli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fli"]

[tool.pytest.ini_options]
# NOTE: pytest.ini exists and takes precedence over this section, so this
# is inert. Markers are registered in pytest.ini.
markers = [
    "parallel: marks tests that can run in parallel"
]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
include = [
    "fli/**/*.py",
    "examples/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "D", # pydocstyle
]
ignore = ["D100", "D104", "D203", "D213"]

# Per-file ignores for examples
[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D401", # First line should be in imperative mood (examples use descriptive docstrings)
    "T201", # print found (examples are meant to print output)
]
"tests/**/*.py" = [
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D107", # Missing docstring in __init__ (test doubles are named, not documented)
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
