[pytest]
markers =
    fuzz: mark test to run only with --fuzz flag
    live: mark test as making real network calls to Google Flights. Not
        skipped by default -- `make test` still runs them -- but CI
        deselects them with -m "not live", because they 429 in cloud
        runners and their flakiness used to cost the whole tests/search/
        directory its CI coverage.
    parallel: mark test to run in parallel with pytest-xdist
    browser: mark test as driving a real browser; needs --browser and
        FLI_BROWSER_CDP_ENDPOINT, and spends live calls against a gated
        Google endpoint. Never run in CI.
    wants_browser: opt a CLI test out of the autouse fixture that pretends
        the browser extra is absent. For tests that patch SearchMultiCity
        themselves; it still never reaches a real browser.
